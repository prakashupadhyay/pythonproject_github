<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register User</title>
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: height; margin-top: 50px;">
    <div style="width: 350px; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        <h2>Create an Account</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
    </div>
</body>
</html>
