name: Deploy to Ready Environment

# Trigger this pipeline whenever code is pushed to 'sandbox'
on:
  push:
    branches:
      - sandbox

      # 2. MANUAL TRIGGER
  # Adds a "Run workflow" button in the GitHub UI with customizable options
  workflow_dispatch:
    inputs:
      target_module:
        description: 'Module to deploy (e.g. userportal, payroll, hr, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - iMaverick_userportal
  schedule:
    # Example: Runs every weekday (Mon-Fri) at 2:00 AM UTC
    - cron: '*/30 * * * 1-5'          
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Add your custom deployment commands here
      - name: Run deployment script
        run: |
          echo "Sandbox code updated! Deploying to the ready environment..."
          # Replace this echo command with your actual deployment steps
          # e.g., deploying to AWS, Vercel, a remote VPS via SSH, etc.